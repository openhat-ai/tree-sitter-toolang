name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    tags:
      - "v*"

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      npm_tag: ${{ steps.metadata.outputs.npm_tag }}
      npm_exists: ${{ steps.metadata.outputs.npm_exists }}
      pypi_exists: ${{ steps.metadata.outputs.pypi_exists }}
      crates_exists: ${{ steps.metadata.outputs.crates_exists }}

    steps:
      - uses: actions/checkout@v6

      - id: metadata
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 <<'PY'
          import json
          import os
          import sys
          import tomllib
          import urllib.error
          import urllib.request
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from release_versions import release_settings

          package = json.loads(Path("package.json").read_text())
          package_lock = json.loads(Path("package-lock.json").read_text())
          grammar = json.loads(Path("tree-sitter.json").read_text())
          pyproject = tomllib.loads(Path("pyproject.toml").read_text())
          cargo = tomllib.loads(Path("Cargo.toml").read_text())
          cargo_lock = tomllib.loads(Path("Cargo.lock").read_text())

          versions = {
              "package.json": package["version"],
              "package-lock.json": package_lock["version"],
              "package-lock.json root": package_lock["packages"][""]["version"],
              "tree-sitter.json": grammar["metadata"]["version"],
              "pyproject.toml": pyproject["project"]["version"],
              "Cargo.toml": cargo["package"]["version"],
              "Cargo.lock": next(
                  item["version"] for item in cargo_lock["package"]
                  if item["name"] == package["name"]
              ),
          }
          unique_versions = set(versions.values())
          if len(unique_versions) != 1:
              raise SystemExit(f"Version mismatch across metadata files: {versions}")

          version = unique_versions.pop()
          python_version, npm_tag = release_settings(version)
          tag_version = os.environ["REF_NAME"].removeprefix("v")
          if version != tag_version:
              raise SystemExit(
                  f"Tag version {tag_version!r} does not match package version {version!r}"
              )

          package_name = package["name"]

          def version_exists(url: str, key: str, expected_version: str) -> bool:
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      data = json.load(response)
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return False
                  raise
              return expected_version in data.get(key, {})

          def crates_version_exists(crate_name: str) -> bool:
              request = urllib.request.Request(
                  f"https://crates.io/api/v1/crates/{crate_name}",
                  headers={"User-Agent": "tree-sitter-toolang-release-check"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      data = json.load(response)
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return False
                  raise
              return any(item.get("num") == version for item in data.get("versions", []))

          npm_exists = version_exists(
              f"https://registry.npmjs.org/{package_name}",
              "versions",
              version,
          )
          pypi_exists = version_exists(
              f"https://pypi.org/pypi/{package_name}/json",
              "releases",
              python_version,
          )
          crates_exists = crates_version_exists(package_name)

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as fh:
              fh.write(f"version={version}\n")
              fh.write(f"npm_tag={npm_tag}\n")
              fh.write(f"npm_exists={'true' if npm_exists else 'false'}\n")
              fh.write(f"pypi_exists={'true' if pypi_exists else 'false'}\n")
              fh.write(f"crates_exists={'true' if crates_exists else 'false'}\n")
          PY

  publish-npm:
    name: Publish npm package
    needs: validate
    if: needs.validate.outputs.npm_exists != 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install grammar tooling
        run: npm ci

      - name: Verify grammar and package contents
        run: |
          npm run check
          npm run pack:dry-run

      - name: Publish to npm
        run: npm publish --provenance --tag "${{ needs.validate.outputs.npm_tag }}"

  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: validate
    if: needs.validate.outputs.pypi_exists != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_BUILD_FRONTEND: build
          CIBW_BUILD: cp311-*
          CIBW_TEST_REQUIRES: pytest>=8 tree-sitter~=0.25
          CIBW_TEST_COMMAND: pytest {project}/tests

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: wheelhouse/*.whl

  build-sdist:
    name: Build sdist
    needs: validate
    if: needs.validate.outputs.pypi_exists != 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build frontend
        run: python -m pip install --upgrade pip build

      - name: Build sdist
        run: python -m build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  publish-pypi:
    name: Publish Python distributions
    needs:
      - validate
      - build-wheels
      - build-sdist
    if: needs.validate.outputs.pypi_exists != 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-rust:
    name: Publish Rust crate
    needs: validate
    if: needs.validate.outputs.crates_exists != 'true'
    runs-on: ubuntu-latest
    env:
      CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        if: env.CRATES_IO_TOKEN != ''
        run: cargo publish --token "$CRATES_IO_TOKEN"

      - name: Skip crates.io publish
        if: env.CRATES_IO_TOKEN == ''
        run: echo "CRATES_IO_TOKEN is not configured; skipping crates.io publish."
