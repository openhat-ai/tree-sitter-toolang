name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust bindings
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Test Rust bindings
        run: cargo test --locked

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v6
        if: matrix.python-version == '3.11'
        with:
          node-version: "20"
          cache: npm

      - name: Install grammar tooling
        if: matrix.python-version == '3.11'
        run: npm ci --prefer-offline

      - name: Verify grammar and CLI checks
        if: matrix.python-version == '3.11'
        run: |
          npm run check
          git diff --exit-code -- src/parser.c src/grammar.json src/node-types.json src/keywords.h GRAMMAR.ebnf

      - name: Verify npm package contents
        if: matrix.python-version == '3.11'
        run: npm run pack:dry-run

      - name: Install Python tooling
        run: python -m pip install --upgrade pip build setuptools wheel pytest tree-sitter~=0.25

      - name: Verify package tooling and build dependencies
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Build distributions
        run: python -m build

      - name: Install wheel and run tests
        run: |
          python -m pip install dist/*.whl
          pytest --durations=10 tests
